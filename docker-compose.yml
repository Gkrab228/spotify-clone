version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio
    container_name: my-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      MINIO_USER: ${MINIO_ACCESS_KEY}
      MINIO_PASSWORD: ${MINIO_SECRET_KEY}
      BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      sleep 5; 
      mc alias set myminio http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD;
      mc mb myminio/$$BUCKET_NAME --ignore-existing;
      mc anonymous set download myminio/$$BUCKET_NAME;
      exit 0;
      "

  nextjs:
    image: node:22-alpine
    container_name: my-nextjs
    working_dir: /app
    volumes:
      - ./next-js:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      DATABASE_URL: ${DATABASE_URL:-postgresql://db_user:db_password@postgres:5432/my_database}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - minio

volumes:
  pg_data:
  minio_data: